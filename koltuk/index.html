<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koltuk Seçimi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="balloons-container">
        <div class="balloon b1"></div>
        <div class="balloon b2"></div>
        <div class="balloon b3"></div>
        <div class="balloon b4"></div>
        <div class="balloon b5"></div>
    </div>
    <div class="main-container">
        <h1>Otobüs Koltuk Seçimi</h1>
        <p class="subtitle">Lütfen boş bir koltuk seçin</p>

        <div class="legend">
            <div class="legend-item"><div class="seat-legend empty"></div> Boş</div>
            <div class="legend-item"><div class="seat-legend male"></div> Erkek Dolu</div>
            <div class="legend-item"><div class="seat-legend female"></div> Kadın Dolu</div>
            <div class="legend-item"><div class="seat-legend pending"></div> İşlemde</div>
        </div>

        <div class="bus-container">
            <div class="steering-wheel">
                <i class="fas fa-steering-wheel"></i> Şoför
            </div>
            <div class="bus-layout" id="bus-layout">
                <!-- JS ile doldurulacak -->
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Scripts -->
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
