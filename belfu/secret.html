<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50 Shades of Mert & Ezgi</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Inter:wght@400;500&family=Dancing+Script:wght@600&family=Cinzel:wght@600&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    <script src="firebase-config.js"></script>
    <style>
        /* Page specific overrides */
        body {
            background: #000;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        #portal-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #fff 0%, #000 100%);
            z-index: 20000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: portalOpen 3s forwards ease-in-out;
            pointer-events: none; /* Allow clicks through if it gets stuck visible but transparent */
        }

        @keyframes portalOpen {
            0% { transform: scale(1); opacity: 1; filter: brightness(100%); }
            40% { transform: scale(5); opacity: 1; filter: brightness(200%); }
            100% { transform: scale(30); opacity: 0; visibility: hidden; }
        }

        .narnia-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('narnia_background.png') no-repeat center center/cover;
            z-index: -1;
            filter: brightness(0.6) contrast(1.2);
        }

        .narnia-container {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .page-title {
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: #bdc3c7; /* Silver */
            text-shadow: 0 0 20px rgba(189, 195, 199, 0.6), 0 0 40px rgba(255, 0, 0, 0.4);
            margin-bottom: 3rem;
            animation: pulse-mist 3s infinite alternate;
        }

        @keyframes pulse-mist {
            0% { opacity: 0.8; transform: scale(1); text-shadow: 0 0 20px rgba(189, 195, 199, 0.6); }
            100% { opacity: 1; transform: scale(1.05); text-shadow: 0 0 30px rgba(255, 51, 51, 0.8); }
        }

        /* Fire Particles container */
        #fire-particles {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            z-index: 0;
            pointer-events: none;
        }

        /* Input Area - Hot & Elegant */
        .input-section {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 69, 0, 0.3);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 3rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.1);
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        /* Textarea Styles */
        .secret-input {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 2px solid #8b0000;
            color: #dcdde1;
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem; /* Slightly smaller for textarea */
            padding: 10px;
            outline: none;
            transition: all 0.3s;
            resize: vertical; /* Allow resizing */
            min-height: 50px;
            max-height: 150px;
            overflow: hidden; 
        }

        /* Delete Button - Strictly Hidden Initially */
        .delete-card {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #c0392b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            cursor: pointer;
            z-index: 30001;
            display: none !important; /* Force hide */
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Only show when card is open */
        .hot-card.open .delete-card {
            display: flex !important;
            animation: fadeIn 0.5s;
        }

    /* ... */



        .add-btn {
            background: linear-gradient(45deg, #8b0000, #ff4500);
            border: none;
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 69, 0, 0.4);
            text-transform: uppercase;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .add-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 69, 0, 0.7);
        }

        /* Grid Layout */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            padding: 1rem;
        }

        /* Hot Card Styles */
        .hot-card {
            background: linear-gradient(135deg, rgba(50, 0, 0, 0.9), rgba(20, 0, 0, 0.95)); /* Darker Red/Black gradient */
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 15px;
            padding: 25px;
            min-height: 220px;
            position: relative;
            cursor: pointer;
            transition: all 0.4s ease;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(139, 0, 0, 0.2);
        }

        .hot-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(255, 69, 0, 0.2), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
            z-index: 1;
        }

        /* Burning Border Animation */
        .hot-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 15px;
            padding: 2px;
            background: linear-gradient(45deg, #ff0000, #ff4500, #ffd700);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .hot-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
            border-color: transparent;
        }

        .hot-card:hover::before, .hot-card:hover::after {
             opacity: 1;
        }

        /* Ensure content is clickable above the effects */
        .card-content {
            position: relative;
            z-index: 10; /* Above pseudo-elements */
            width: 100%;
            height: 100%;
        }

        .delete-card {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 0, 0, 0.7);
            border: none;
            color: white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            z-index: 20; /* Above everything */
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-card:hover {
            transform: scale(1.1);
            background: red;
        }

        /* ... existing styles ... */
        
        /* Modal Styles */
        .secret-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 30000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: url('https://www.transparenttextures.com/patterns/aged-paper.png'), linear-gradient(135deg, #fffaf0, #e6dbc4);
            padding: 2rem;
            width: 90%;
            max-width: 600px;
            max-height: 80vh; /* Max height for scrolling */
            border-radius: 10px;
            position: relative;
            box-shadow: 0 0 50px rgba(255, 69, 0, 0.5);
            border: 2px solid #8b7355;
            display: flex;
            flex-direction: column;
            animation: zoomIn 0.3s ease;
        }

        .modal-body {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #4a3b2a;
            line-height: 1.6;
            overflow-y: auto; /* Scrollable */
            padding-right: 10px;
            margin-top: 20px;
            white-space: pre-wrap; /* Preserve newlines */
        }

        /* Custom Scrollbar for Modal */
        .modal-body::-webkit-scrollbar { width: 8px; }
        .modal-body::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 4px; }
        .modal-body::-webkit-scrollbar-thumb { background: #8b7355; border-radius: 4px; }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 2rem;
            color: #8b0000;
            cursor: pointer;
            background: none;
            border: none;
            transition: transform 0.2s;
        }

        .close-modal:hover { transform: scale(1.1); }

    </style>
</head>
<body>

    <!-- Portal Animation Layer -->
    <div id="portal-animation"></div>

    <!-- Background -->
    <div class="narnia-bg"></div>
    <div id="fire-particles"></div>

    <!-- Navigation -->
    <button class="back-btn" onclick="window.location.href='index.html'">
        <i class="fas fa-arrow-left"></i>
    </button>
    
    <!-- Secret Modal -->
    <div id="secret-modal" class="secret-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <div id="modal-text" class="modal-body">
                <!-- Secret content goes here -->
            </div>
        </div>
    </div>

    <div class="narnia-container animate__animated animate__fadeIn" style="animation-delay: 1.5s;">
        <h1 class="page-title">50 Shades of Mert & Ezgi</h1>
        <!-- ... input section ... -->
        <div class="input-section">
            <textarea id="secret-input" class="secret-input" placeholder="Bir fantezi veya sır ekle... (Satır atlamak için Enter)"></textarea>
            <button id="add-secret-btn" class="add-btn">Ekle <i class="fas fa-fire"></i></button>
        </div>

        <div id="cards-grid" class="cards-grid">
            <!-- Cards go here -->
            <div style="color: #666; text-align: center; width: 100%; grid-column: 1/-1;">Yükleniyor...</div>
        </div>
    </div>

    <!-- Scripts -->
    <!-- ... scripts ... -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-slim@2.0.6/tsparticles.slim.bundle.min.js"></script>
    
    <script>
        // Global Data Store
        window.secretData = {};

        // Setup Modal Logic
        const modal = document.getElementById('secret-modal');
        const modalText = document.getElementById('modal-text');
        const closeBtn = document.querySelector('.close-modal');

        // Close functions
        const closeModal = () => {
            modal.style.display = 'none';
        };

        if(closeBtn) closeBtn.addEventListener('click', closeModal);
        
        window.onclick = (event) => {
            if (event.target == modal) closeModal();
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            
            // Remove Portal Animation - Force display none and pointer-events none
            setTimeout(() => {
                const portal = document.getElementById('portal-animation');
                if(portal) {
                    portal.style.display = 'none';
                    portal.style.pointerEvents = 'none'; // Double assurance
                }
            }, 3500);

            // Init Firebase
            let db;
            try {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
            } catch (e) { console.error("Firebase Init Error:", e); }

            // Auth Check
            const secretKey = sessionStorage.getItem('secret_key');
            
            // Logic
            const addBtn = document.getElementById('add-secret-btn');
            const inputField = document.getElementById('secret-input');
            const grid = document.getElementById('cards-grid');

            if(addBtn && inputField) {
                const addSecretItem = () => {
                    const val = inputField.value.trim();
                    if (!val) return;
                    if (!db || !secretKey) return alert("Hata: Veritabanı veya şifre yok.");

                    const encrypted = CryptoJS.AES.encrypt(val, secretKey).toString();
                    db.collection('secret_notes').add({
                        content: encrypted,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        completed: false
                    }).then(() => {
                        inputField.value = '';
                        inputField.style.borderColor = "#00ff00";
                        setTimeout(() => inputField.style.borderColor = "#8b0000", 500);
                    });
                };

                addBtn.addEventListener('click', addSecretItem);
                inputField.addEventListener('keydown', (e) => {
                   if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                       e.preventDefault();
                       addSecretItem();
                   }
                });
            }

            // Realtime Listener
            if (db) {
                db.collection('secret_notes').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
                    grid.innerHTML = '';
                    if (snapshot.empty) {
                        grid.innerHTML = '<div style="color: #666; text-align: center; width: 100%; grid-column: 1/-1;">Henüz sır yok...</div>';
                        return;
                    }
                    
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        let text = '???';
                        try {
                            if (secretKey) {
                                const bytes = CryptoJS.AES.decrypt(data.content, secretKey);
                                text = bytes.toString(CryptoJS.enc.Utf8);
                            }
                        } catch (e) {}
                        
                        if (!text) text = '???';
                        
                        // Store in global scope
                        window.secretData[doc.id] = text;

                        const card = document.createElement('div');
                        card.className = 'hot-card animate__animated animate__fadeInUp';
                        card.dataset.id = doc.id; // Store ID in dataset
                        
                        card.innerHTML = `
                             <button class="delete-card"><i class="fas fa-times"></i></button>
                            <div class="card-content">
                                <i class="fas fa-fire-alt" style="font-size: 3rem; color: #ff4500; margin-bottom: 10px;"></i>
                                <div style="font-size: 1.2rem; margin-top: 10px;">Gizli Mektup</div>
                                <div style="font-size: 0.8rem; opacity: 0.7;">(Okumak için tıkla)</div>
                            </div>
                        `;
                        
                        // Attach Event Listeners explicitly
                        const deleteBtn = card.querySelector('.delete-card');
                        const contentDiv = card.querySelector('.card-content');
                        
                        deleteBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            deleteItem(doc.id);
                        });
                        
                        contentDiv.addEventListener('click', () => {
                            openSecret(doc.id);
                        });

                        grid.appendChild(card);
                    });
                });
            }
            
            // Particles
             if (typeof tsParticles !== 'undefined') {
                tsParticles.load("fire-particles", {
                    particles: {
                        number: { value: 60, density: { enable: true, value_area: 800 } },
                        color: { value: ["#ff0000", "#ff4500", "#ffa500"] },
                        shape: { type: "circle" },
                        opacity: { value: 0.5, random: true, anim: { enable: true, speed: 1, opacity_min: 0.1, sync: false } },
                        size: { value: 4, random: true, anim: { enable: true, speed: 2, size_min: 0.1, sync: false } },
                        move: { enable: true, speed: 3, direction: "top", random: true, out_mode: "out", attract: { enable: false } }
                    },
                    interactivity: {
                        detect_on: "canvas",
                        events: { onhover: { enable: true, mode: "bubble" }, onclick: { enable: true, mode: "repulse" } },
                        modes: { bubble: { distance: 200, size: 6, duration: 2, opacity: 1 }, repulse: { distance: 200, duration: 0.4 } }
                    },
                    retina_detect: true
                });
            }
        });

        // Global functions
        window.openSecret = (id) => {
            const text = window.secretData[id] || "İçerik bulunamadı.";
            modalText.textContent = text; // Safer than innerText/innerHTML for unknown content
            modal.style.display = 'flex';
        };

        window.deleteItem = (id) => {
             Swal.fire({
                title: 'Sil?',
                icon: 'warning',
                background: '#111',
                color: '#fff',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Evet!'
            }).then((result) => {
                if (result.isConfirmed) {
                    const db = firebase.firestore();
                    db.collection('secret_notes').doc(id).delete();
                }
            });
        };

    </script>
</body>
</html>
