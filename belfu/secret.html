        /* Page specific overrides */
        body {
            background: #000;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;

        #portal-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #fff 0%, #000 100%);
            z-index: 20000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: portalOpen 3s forwards ease-in-out;
            pointer-events: none; /* Allow clicks through if it gets stuck visible but transparent */
        }

        @keyframes portalOpen {
            0% { transform: scale(1); opacity: 1; filter: brightness(100%); }
            40% { transform: scale(5); opacity: 1; filter: brightness(200%); }
            100% { transform: scale(30); opacity: 0; visibility: hidden; }

        .narnia-bg {

            top: 0;
            left: 0;

        .add-btn {

        }

        .hot-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(255, 69, 0, 0.2), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
            z-index: 1;
        }

        /* Burning Border Animation */
        .hot-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 15px;
            padding: 2px;
            background: linear-gradient(45deg, #ff0000, #ff4500, #ffd700);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s;

            box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);

        const closeModal = () => { if(modal) modal.style.display = 'none'; };

                    if (!firebase.apps.length) firebase.initializeApp(window.firebaseConfig);

            if(modal) modal.style.display = 'flex';
        };

             Swal.fire({
                title: 'Sil?', icon: 'warning', background: '#111', color: '#fff',

            }).then((result) => {
                if (result.isConfirmed && db) {

                }

        function setupTabLogic() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
                    const targetId = 'tab-' + btn.dataset.tab;
                    const target = document.getElementById(targetId);
                    if(target) {
                        target.style.display = 'block';
                        target.classList.add('animate__animated', 'animate__fadeIn');
                    }
                });
            });
        }



        // --- TO-DO LISTENER ---
        function setupToDoListener() {
            const list = document.getElementById('todo-list');
            if(!db || !list) return;

            // Listen to 'memories_todo' where type is 'position_challenge' or generic
            db.collection('memories_todo')
              .where('completed', '==', false) // Only show incomplete
              .orderBy('timestamp', 'desc')
              .onSnapshot(snapshot => {
                  list.innerHTML = '';
                  if(snapshot.empty) {
                      list.innerHTML = '<div style="text-align:center; color:#bdc3c7; font-style:italic; padding:20px;">Henüz yapacak bir şey yok... Çarkı çevir! 🔥</div>';
                      return;
                  }
                  
                  snapshot.forEach(doc => {
                      const data = doc.data();
                      let text = data.text || '';

                      // SANITIZATION: Fix corrupted characters from before
                      if(text.includes('ğŸ”¥') || text.includes('Ã§')) {
                          try {
                             // Simple manual fix for the specific emoji issue
                             text = text.replace(/ğŸ”¥/g, '🔥');
                             // If completely garbled, maybe just use name if possible, but we modify display text
                             // decodeURIComponent(escape(text)) might work if it was double encoded, but let's stick to simple replacement
                          } catch(e) {}
                      }

                      const item = document.createElement('div');
                      item.className = 'todo-card animate__animated animate__fadeInUp';
                      
                      let imgHtml = '';
                      if(data.img) {
                          imgHtml = `<img src="${data.img}" style="width: 60px; height: 60px; object-fit: cover; border-radius: 8px; margin-right: 15px; border: 1px solid #ff4500;">`;
                      }

                      item.innerHTML = `
                          ${imgHtml}
                          <div class="todo-text">${text}</div>
                          <button class="todo-check-btn" title="Tamamla"><i class="fas fa-check"></i></button>
                      `;
                      
                      const btn = item.querySelector('.todo-check-btn');
                      btn.onclick = () => {
                           Swal.fire({
                              title: 'Tamamladınız mı?', 
                              text: "Bu anı sonsuzluğa uğurluyoruz...",
                              icon: 'question', 
                              showCancelButton: true, 
                              confirmButtonText: 'Evet, yaptık! 🔥', 
                              cancelButtonText: 'Hayır',
                              background: '#111', color: '#fff'
                           }).then((res) => {
                               if(res.isConfirmed) {
                                   // Mark as completed
                                   db.collection('memories_todo').doc(doc.id).update({ completed: true });
                                   
                                   // RESET EXCLUSION: Allow this position to be picked again
                                   if(data.positionId) {
                                       db.collection('positions').doc(data.positionId).update({ inTodo: false })
                                       .catch(err => console.log("Could not reset position status:", err));
                                   }

                                   // Celebration confetti?
                                   if (typeof tsParticles !== 'undefined') {
                                        // Simple confetti burst could go here
                                   }
                               }
                           });
                      };
                      
                      list.appendChild(item);
                  });
              });
        }

        // --- RANDOM PICKER LOGIC (The Fix) ---
        function setupRandomPicker() {
            const randomBtn = document.getElementById('random-btn');
            const resultOverlay = document.getElementById('result-overlay');
            const posTitle = document.getElementById('pos-title');
            const posDesc = document.getElementById('pos-desc');
            const posImg = document.getElementById('pos-img');
            const closeResultBtn = document.getElementById('close-result');
            const acceptBtn = document.getElementById('accept-btn');
            
            let isSelecting = false;
            let currentSelection = null;

            if(closeResultBtn) closeResultBtn.onclick = () => resultOverlay.style.display = 'none';
            
            if(acceptBtn) {
                acceptBtn.onclick = () => {
                    if(!currentSelection || !db) return;
                    
                    // Add to To-Do with positionId
                    db.collection('memories_todo').add({
                        text: `🔥 ${currentSelection.name}`,
                        completed: false,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        type: 'position_challenge',
                        positionId: currentSelection.id || null, // Store ID to link back
                        img: currentSelection.img || null // Store image if available
                    });

                    // MARK AS IN-TODO (Exclude from random picker)
                    if(currentSelection.id) {
                        db.collection('positions').doc(currentSelection.id).update({ inTodo: true })
                        .catch(err => console.error("Error updating position status:", err));
                    }

                    Swal.fire({ title: 'Eklendi!', icon: 'success', timer: 1000, showConfirmButton: false, background: '#000', color: '#fff'});
                    resultOverlay.style.display = 'none';
                };
            }

            if(randomBtn) {
                randomBtn.onclick = async () => {
                    if(isSelecting) return;
                    isSelecting = true;
                    
                    const originalHTML = randomBtn.innerHTML;
                    randomBtn.innerHTML = '<i class="fas fa-spinner fa-spin" style="font-size: 3rem;"></i><br><span>Seçiliyor...</span>';
                    
                    // The core logic: Try Firebase, fallback to Local
                    let selectedData = null;

                    try {
                        let firebaseWorks = false;
                        if(db) {
                            // Try to fetch a position that is NOT in Todo
                            // Since we can't easily query random + filter in Firestore without an index or complex ID logic,
                            // We will fetch a random ID, check if it's inTodo. If so, retry.
                            // Max retries to prevent infinite loops.
                            let found = false;
                            let attempts = 0;
                            const maxAttempts = 5;

                            while(!found && attempts < maxAttempts) {
                                attempts++;
                                const rnd = Math.floor(Math.random() * 300); 
                                const docId = 'pos_' + rnd;
                                const doc = await db.collection('positions').doc(docId).get().catch(() => null);
                                
                                if(doc && doc.exists) {
                                    const data = doc.data();
                                    // Check exclusion
                                    if(!data.inTodo) {
                                        selectedData = { ...data, id: docId }; // Include ID
                                        firebaseWorks = true;
                                        found = true;
                                    } else {
                                        console.log(`Position ${docId} is in To-Do. Skipping.`);
                                    }
                                }
                            }
                            
                            // Fallback if max attempts reached (just show one anyway or show local)
                            if(!found && attempts >= maxAttempts) {
                                console.warn("Could not find free position after retries.");
                            }
                        }

                        if(!firebaseWorks || !selectedData) {
                            console.error("Could not fetch from Firebase");
                            alert("Bağlantı hatası veya tüm pozisyonlar tamamlandı!");
                            isSelecting = false;
                            randomBtn.innerHTML = originalHTML;
                            return; 
                        }

                    } catch(e) {
                        console.error("Picker Error:", e);
                        selectedData = LOCAL_POSITIONS[Math.floor(Math.random() * LOCAL_POSITIONS.length)];
                    }

                    // Display Result
                    setTimeout(() => {
                        currentSelection = selectedData;
                        posTitle.innerText = selectedData.name;
                        posDesc.innerText = selectedData.desc;
                        if(posImg) {
                            posImg.style.display = 'none'; // Default hidden
                            if(selectedData.img) {
                                posImg.src = selectedData.img;
                                posImg.style.display = 'block';
                            }
                        }
                        resultOverlay.style.display = 'flex';
                        
                        randomBtn.innerHTML = originalHTML;
                        isSelecting = false;
                    }, 800);
                };
            }
        }
