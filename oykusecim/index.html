<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öykü'nün Bölüm Seçimi - Mert Cihan Bayır</title>
    <meta name="description" content="Öykü için hazırlanmış bölüm raporları ve değerlendirmeleri">
    <link rel="icon" type="image/png" href="../mcb.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ===== CSS Variables ===== */
        :root {
            --sidebar-width: 320px;
            --bg-deep: #0a0e1a;
            --bg-surface: #111827;
            --bg-card: #1e293b;
            --bg-card-hover: #263348;
            --bg-sidebar: #0f1729;
            --accent-primary: #818cf8;
            --accent-secondary: #a78bfa;
            --accent-glow: rgba(129, 140, 248, 0.15);
            --accent-glow-strong: rgba(129, 140, 248, 0.3);
            --text-white: #f9fafb;
            --text-light: #d1d5db;
            --text-muted: #9ca3af;
            --text-dim: #6b7280;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-accent: rgba(129, 140, 248, 0.3);
            --gradient-accent: linear-gradient(135deg, #6366f1, #8b5cf6, #a78bfa);
            --gradient-warm: linear-gradient(135deg, #f472b6, #818cf8);
            --shadow-glow: 0 0 20px rgba(129, 140, 248, 0.1);
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.3);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===== Reset ===== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-deep);
            color: var(--text-light);
        }

        /* ===== Animated Background ===== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-animation .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: orbFloat 20s ease-in-out infinite;
        }

        .bg-animation .orb:nth-child(1) {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.3), transparent 70%);
            top: -100px; left: -100px;
            animation-duration: 25s;
        }

        .bg-animation .orb:nth-child(2) {
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.25), transparent 70%);
            bottom: -50px; right: -50px;
            animation-duration: 30s;
            animation-delay: -5s;
        }

        .bg-animation .orb:nth-child(3) {
            width: 250px; height: 250px;
            background: radial-gradient(circle, rgba(244, 114, 182, 0.2), transparent 70%);
            top: 50%; left: 50%;
            animation-duration: 22s;
            animation-delay: -10s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(50px, -30px) scale(1.1); }
            50% { transform: translate(-20px, 40px) scale(0.95); }
            75% { transform: translate(30px, 20px) scale(1.05); }
        }

        /* ===== Layout ===== */
        .app-layout {
            position: relative;
            z-index: 1;
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* ===== Sidebar ===== */
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            height: 100vh;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform var(--transition);
            position: relative;
        }

        .sidebar::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 1px;
            height: 100%;
            background: linear-gradient(to bottom, transparent, var(--accent-primary), transparent);
            opacity: 0.3;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .sidebar-back {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
            padding: 0.5rem 1rem;
            border-radius: 10px;
            transition: var(--transition);
            background: transparent;
        }

        .sidebar-back:hover {
            color: var(--text-white);
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(-3px);
        }

        .sidebar-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--text-white);
            letter-spacing: -0.02em;
            margin-bottom: 0.3rem;
        }

        .sidebar-title .highlight {
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sidebar-subtitle {
            font-size: 0.8rem;
            color: var(--text-dim);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .sidebar-section-title {
            padding: 1.2rem 1.5rem 0.6rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            flex-shrink: 0;
        }

        .sidebar-section-title i {
            margin-right: 0.4rem;
            color: var(--accent-primary);
            font-size: 0.65rem;
        }

        /* ===== File List ===== */
        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
            scrollbar-width: thin;
            scrollbar-color: var(--bg-card) transparent;
        }

        .file-list::-webkit-scrollbar {
            width: 4px;
        }

        .file-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .file-list::-webkit-scrollbar-thumb {
            background: var(--bg-card);
            border-radius: 4px;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.85rem 1rem;
            margin: 2px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-muted);
            font-size: 0.9rem;
            position: relative;
            border: 1px solid transparent;
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-light);
            border-color: var(--border-subtle);
        }

        .file-item.active {
            background: var(--accent-glow);
            color: var(--text-white);
            border-color: var(--border-accent);
            box-shadow: var(--shadow-glow);
        }

        .file-item.active .file-icon {
            color: var(--accent-primary);
            transform: scale(1.1);
        }

        .file-icon {
            font-size: 1rem;
            transition: var(--transition);
            flex-shrink: 0;
            width: 20px;
            text-align: center;
        }

        .file-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 400;
        }

        .file-item.active .file-name {
            font-weight: 500;
        }

        /* ===== Loading Indicator in sidebar ===== */
        .sidebar-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
            color: var(--text-dim);
            gap: 1rem;
        }

        .sidebar-loading .spinner {
            width: 28px;
            height: 28px;
            border: 2px solid var(--border-subtle);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .sidebar-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
            text-align: center;
            color: var(--text-dim);
            gap: 0.8rem;
        }

        .sidebar-empty i {
            font-size: 2.5rem;
            opacity: 0.3;
        }

        .sidebar-empty p {
            font-size: 0.85rem;
            line-height: 1.5;
        }

        /* ===== Main Content ===== */
        .main-content {
            flex: 1;
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            scrollbar-width: thin;
            scrollbar-color: var(--bg-card) transparent;
        }

        .main-content::-webkit-scrollbar {
            width: 6px;
        }

        .main-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .main-content::-webkit-scrollbar-thumb {
            background: var(--bg-card);
            border-radius: 6px;
        }

        /* ===== Welcome Screen ===== */
        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            animation: fadeIn 0.6s ease-out;
        }

        .welcome-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            background: var(--gradient-warm);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.08); opacity: 1; }
        }

        .welcome-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 400;
            color: var(--text-white);
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .welcome-subtitle {
            color: var(--text-dim);
            font-size: 1rem;
            max-width: 400px;
            line-height: 1.6;
        }

        /* ===== Markdown Viewer ===== */
        .md-viewer {
            flex: 1;
            padding: 2.5rem 3rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .md-viewer-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .md-viewer-header i {
            color: var(--accent-primary);
            font-size: 1.2rem;
        }

        .md-viewer-header .file-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* ===== Markdown Rendered Content ===== */
        .md-body h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--text-white);
            margin-bottom: 1rem;
            line-height: 1.3;
            letter-spacing: -0.03em;
            padding-bottom: 0.8rem;
            border-bottom: 2px solid var(--border-subtle);
        }

        .md-body h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 500;
            color: var(--text-white);
            margin-top: 2.5rem;
            margin-bottom: 0.8rem;
            line-height: 1.35;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .md-body h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--text-white);
            margin-top: 2rem;
            margin-bottom: 0.6rem;
        }

        .md-body h4 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--accent-secondary);
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .md-body h5, .md-body h6 {
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-top: 1.2rem;
            margin-bottom: 0.4rem;
        }

        .md-body p {
            margin-bottom: 1rem;
            line-height: 1.8;
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .md-body a {
            color: var(--accent-primary);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: var(--transition);
        }

        .md-body a:hover {
            border-bottom-color: var(--accent-primary);
        }

        .md-body strong {
            color: var(--text-white);
            font-weight: 600;
        }

        .md-body em {
            color: var(--accent-secondary);
            font-style: italic;
        }

        .md-body ul, .md-body ol {
            margin-bottom: 1rem;
            padding-left: 1.5rem;
        }

        .md-body li {
            margin-bottom: 0.4rem;
            line-height: 1.7;
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .md-body li::marker {
            color: var(--accent-primary);
        }

        .md-body blockquote {
            border-left: 3px solid var(--accent-primary);
            background: rgba(129, 140, 248, 0.06);
            padding: 1rem 1.5rem;
            margin: 1.5rem 0;
            border-radius: 0 12px 12px 0;
            color: var(--text-muted);
            font-style: italic;
        }

        .md-body blockquote p {
            margin-bottom: 0;
            color: var(--text-muted);
        }

        .md-body code {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            background: rgba(255, 255, 255, 0.06);
            padding: 0.15rem 0.5rem;
            border-radius: 6px;
            font-size: 0.85em;
            color: var(--accent-secondary);
            border: 1px solid var(--border-subtle);
        }

        .md-body pre {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            overflow-x: auto;
        }

        .md-body pre code {
            background: none;
            padding: 0;
            border: none;
            color: var(--text-light);
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .md-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-subtle);
        }

        .md-body thead {
            background: var(--bg-card);
        }

        .md-body th {
            padding: 0.8rem 1rem;
            text-align: left;
            font-weight: 600;
            color: var(--text-white);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .md-body td {
            padding: 0.8rem 1rem;
            border-top: 1px solid var(--border-subtle);
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .md-body tbody tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .md-body hr {
            border: none;
            height: 1px;
            background: var(--border-subtle);
            margin: 2rem 0;
        }

        .md-body img {
            max-width: 100%;
            border-radius: 12px;
            margin: 1rem 0;
            border: 1px solid var(--border-subtle);
        }

        /* ===== Content Loading ===== */
        .content-loading {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            color: var(--text-dim);
        }

        .content-loading .spinner-lg {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-subtle);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* ===== Error State ===== */
        .error-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            color: var(--text-dim);
            gap: 1rem;
        }

        .error-state i {
            font-size: 3rem;
            color: #f87171;
            opacity: 0.6;
        }

        .error-state p {
            max-width: 350px;
            line-height: 1.6;
        }

        /* ===== Mobile Toggle ===== */
        .mobile-toggle {
            display: none;
            position: fixed;
            bottom: 1.5rem;
            left: 1.5rem;
            z-index: 100;
            width: 52px;
            height: 52px;
            border-radius: 16px;
            border: 1px solid var(--border-accent);
            background: var(--bg-card);
            color: var(--accent-primary);
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: var(--shadow-card), var(--shadow-glow);
            transition: var(--transition);
            align-items: center;
            justify-content: center;
        }

        .mobile-toggle:hover {
            background: var(--accent-glow-strong);
            transform: scale(1.05);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 49;
            backdrop-filter: blur(4px);
        }

        /* ===== Responsive - Tablet ===== */
        @media (max-width: 1024px) {
            :root {
                --sidebar-width: 290px;
            }

            .md-viewer {
                padding: 2rem;
            }
        }

        /* ===== Responsive - Mobile ===== */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                width: 85vw;
                max-width: 320px;
                z-index: 50;
                transform: translateX(-100%);
                box-shadow: 4px 0 30px rgba(0, 0, 0, 0.5);
                transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay.active {
                display: block;
            }

            .mobile-toggle {
                display: flex;
            }

            /* Mobile top header bar */
            .mobile-header {
                display: flex;
            }

            /* Main content adjustments */
            .main-content {
                padding-top: 56px; /* space for mobile header */
            }

            .md-viewer {
                padding: 1.25rem 1rem;
            }

            .md-viewer-header {
                padding-bottom: 1rem;
                margin-bottom: 1.2rem;
            }

            .md-viewer-header .file-title {
                font-size: 0.95rem;
            }

            /* Typography scaling */
            .md-body h1 {
                font-size: 1.5rem;
                margin-bottom: 0.8rem;
                padding-bottom: 0.6rem;
                word-break: break-word;
            }

            .md-body h2 {
                font-size: 1.25rem;
                margin-top: 1.8rem;
                margin-bottom: 0.6rem;
            }

            .md-body h3 {
                font-size: 1.1rem;
                margin-top: 1.5rem;
            }

            .md-body h4 {
                font-size: 1rem;
            }

            .md-body p {
                font-size: 0.9rem;
                line-height: 1.75;
                margin-bottom: 0.8rem;
            }

            .md-body li {
                font-size: 0.9rem;
                line-height: 1.65;
            }

            .md-body ul, .md-body ol {
                padding-left: 1.2rem;
            }

            /* Tables: horizontally scrollable on mobile */
            .md-body table {
                display: block;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                white-space: nowrap;
                margin: 1rem 0;
            }

            .md-body th, .md-body td {
                padding: 0.6rem 0.8rem;
                font-size: 0.8rem;
            }

            /* Code blocks: scrollable */
            .md-body pre {
                padding: 1rem;
                margin: 1rem 0;
                border-radius: 10px;
                font-size: 0.8rem;
            }

            .md-body code {
                font-size: 0.8em;
                word-break: break-word;
            }

            .md-body blockquote {
                padding: 0.8rem 1rem;
                margin: 1rem 0;
            }

            .md-body img {
                border-radius: 8px;
            }

            /* Welcome screen */
            .welcome-title {
                font-size: 1.4rem;
            }

            .welcome-icon {
                font-size: 2.8rem;
                margin-bottom: 1rem;
            }

            .welcome-subtitle {
                font-size: 0.9rem;
                max-width: 300px;
            }

            /* File items: bigger touch targets */
            .file-item {
                padding: 0.95rem 1rem;
                min-height: 48px;
                font-size: 0.88rem;
            }

            /* Sidebar header */
            .sidebar-header {
                padding: 1.2rem;
            }

            .sidebar-title {
                font-size: 1.3rem;
            }

            .sidebar-back {
                font-size: 0.8rem;
                padding: 0.45rem 0.9rem;
                margin-bottom: 1rem;
            }

            /* Error state */
            .error-state i {
                font-size: 2.5rem;
            }

            .error-state p {
                font-size: 0.9rem;
            }
        }

        /* ===== Responsive - Small Mobile ===== */
        @media (max-width: 480px) {
            .sidebar {
                width: 88vw;
                max-width: 300px;
            }

            .md-viewer {
                padding: 1rem 0.8rem;
            }

            .md-body h1 {
                font-size: 1.3rem;
            }

            .md-body h2 {
                font-size: 1.15rem;
            }

            .md-body p, .md-body li {
                font-size: 0.85rem;
            }

            .welcome-title {
                font-size: 1.2rem;
            }

            .welcome-icon {
                font-size: 2.2rem;
            }

            .welcome-subtitle {
                font-size: 0.85rem;
                max-width: 260px;
            }

            .mobile-toggle {
                bottom: 1rem;
                left: 1rem;
                width: 48px;
                height: 48px;
                border-radius: 14px;
            }
        }

        /* ===== Safe area for notched phones ===== */
        @supports (padding: env(safe-area-inset-bottom)) {
            .mobile-toggle {
                bottom: calc(1.5rem + env(safe-area-inset-bottom));
            }

            .sidebar-footer {
                padding-bottom: calc(1rem + env(safe-area-inset-bottom));
            }
        }

        /* ===== Mobile Header Bar ===== */
        .mobile-header {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            z-index: 40;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
        }

        .mobile-header-left {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .mobile-header .menu-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border: none;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-light);
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .mobile-header .menu-btn:active {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(0.95);
        }

        .mobile-header-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.05rem;
            font-weight: 500;
            background: var(--gradient-accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .mobile-header .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 10px;
            font-size: 1rem;
            transition: var(--transition);
        }

        .mobile-header .back-link:active {
            background: rgba(255, 255, 255, 0.06);
        }

        /* ===== Sidebar Footer ===== */
        .sidebar-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }

        .sidebar-footer p {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-align: center;
            letter-spacing: 0.05em;
        }

        .sidebar-footer .heart {
            color: #f472b6;
        }
    </style>
</head>
<body>

    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <!-- Mobile Header Bar -->
    <header class="mobile-header" id="mobile-header">
        <div class="mobile-header-left">
            <button class="menu-btn" id="mobile-menu-btn" title="Bölümler menüsü">
                <i class="fas fa-bars"></i>
            </button>
            <span class="mobile-header-title">Seçim</span>
        </div>
        <a href="../index.html" class="back-link" title="Ana Sayfa">
            <i class="fas fa-home"></i>
        </a>
    </header>

    <!-- App Layout -->
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="../index.html" class="sidebar-back" id="back-btn">
                    <i class="fas fa-arrow-left"></i>
                    <span>Ana Sayfa</span>
                </a>
                <div class="sidebar-title"><span class="highlight">Seçim</span></div>
                <div class="sidebar-subtitle">Bölüm Raporları</div>
            </div>

            <div class="sidebar-section-title">
                <i class="fas fa-circle"></i>
                Bölümler
            </div>

            <div class="file-list" id="file-list">
                <!-- Populated by JS -->
                <div class="sidebar-loading" id="sidebar-loading">
                    <div class="spinner"></div>
                    <span style="font-size: 0.85rem;">Raporlar yükleniyor...</span>
                </div>
            </div>

            <div class="sidebar-footer">
                <p>Made with <span class="heart">♥</span> by Abi</p>
            </div>
        </aside>

        <!-- Mobile Overlay -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- Main Content -->
        <main class="main-content" id="main-content">
            <!-- Welcome Screen (default) -->
            <div class="welcome-screen" id="welcome-screen">
                <div class="welcome-icon">
                    <i class="fas fa-book-open"></i>
                </div>
                <h1 class="welcome-title">Hoş Geldin Armut 🌸</h1>
                <p class="welcome-subtitle">Sol taraftaki listeden incelemek istediğin bölüm raporunu seçerek detayları okuyabilirsin.</p>
            </div>
        </main>
    </div>

    <script>
        // ===== Configuration =====
        const BOLUMLER_DIR = 'bolumler/';

        // ===== State =====
        let currentFile = null;
        let fileListData = [];

        // ===== DOM Elements =====
        const fileListEl = document.getElementById('file-list');
        const sidebarLoading = document.getElementById('sidebar-loading');
        const mainContent = document.getElementById('main-content');
        const welcomeScreen = document.getElementById('welcome-screen');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');

        // ===== Markdown Configuration =====
        marked.setOptions({
            breaks: true,
            gfm: true
        });

        // ===== Load File Index =====
        async function loadFileIndex() {
            try {
                const response = await fetch(BOLUMLER_DIR + 'index.json');
                if (response.ok) {
                    const data = await response.json();
                    fileListData = data.files || data;
                } else {
                    fileListData = await discoverFiles();
                }
            } catch (e) {
                fileListData = await discoverFiles();
            }

            renderFileList();
        }

        // Fallback discovery
        async function discoverFiles() {
            const possibleFiles = [];
            try {
                const response = await fetch(BOLUMLER_DIR);
                if (response.ok) {
                    const html = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const links = doc.querySelectorAll('a[href$=".md"]');
                    links.forEach(link => {
                        const href = link.getAttribute('href');
                        if (href && href.endsWith('.md')) {
                            possibleFiles.push(href.split('/').pop());
                        }
                    });
                }
            } catch(e) {}
            return possibleFiles;
        }

        // ===== Render File List =====
        function renderFileList() {
            sidebarLoading.style.display = 'none';

            if (fileListData.length === 0) {
                fileListEl.innerHTML = `
                    <div class="sidebar-empty">
                        <i class="fas fa-folder-open"></i>
                        <p>Henüz bölüm raporu eklenmemiş.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            fileListData.forEach((file, index) => {
                const fileName = typeof file === 'string' ? file : file.name;
                const displayName = formatFileName(fileName);
                html += `
                    <div class="file-item" data-file="${fileName}" onclick="selectFile('${fileName}')" style="animation: fadeIn 0.4s ease-out ${index * 0.05}s both;">
                        <i class="fas fa-file-lines file-icon"></i>
                        <span class="file-name">${displayName}</span>
                    </div>
                `;
            });
            fileListEl.innerHTML = html;
        }

        // ===== Format File Name =====
        function formatFileName(filename) {
            return filename
                .replace(/\.md$/i, '')
                .replace(/[-_]/g, ' ')
                .replace(/\b\w/g, c => c.toUpperCase());
        }

        // ===== Select & Load File =====
        async function selectFile(filename) {
            // Update active state
            document.querySelectorAll('.file-item').forEach(el => {
                el.classList.remove('active');
            });
            const activeItem = document.querySelector(`[data-file="${filename}"]`);
            if (activeItem) activeItem.classList.add('active');

            currentFile = filename;

            // Close mobile sidebar
            closeSidebar();

            // Show loading
            mainContent.innerHTML = `
                <div class="content-loading">
                    <div class="spinner-lg"></div>
                    <span>Rapor yükleniyor...</span>
                </div>
            `;

            try {
                const response = await fetch(BOLUMLER_DIR + filename);
                if (!response.ok) throw new Error('Dosya bulunamadı');

                const mdText = await response.text();
                const htmlContent = marked.parse(mdText);

                mainContent.innerHTML = `
                    <div class="md-viewer">
                        <div class="md-viewer-header">
                            <i class="fas fa-file-lines"></i>
                            <span class="file-title">${formatFileName(filename)}</span>
                        </div>
                        <div class="md-body">
                            ${htmlContent}
                        </div>
                    </div>
                `;

                // Scroll to top
                mainContent.scrollTop = 0;
            } catch (e) {
                mainContent.innerHTML = `
                    <div class="error-state">
                        <i class="fas fa-triangle-exclamation"></i>
                        <p><strong>Rapor yüklenemedi</strong></p>
                        <p>${e.message}</p>
                    </div>
                `;
            }
        }

        // ===== Mobile Sidebar Controls =====
        function openSidebar() {
            sidebar.classList.add('open');
            sidebarOverlay.classList.add('active');
            document.body.style.overflow = 'hidden'; // Prevent background scroll
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
            sidebarOverlay.classList.remove('active');
            document.body.style.overflow = ''; // Restore scroll
        }

        // Mobile header menu button
        mobileMenuBtn.addEventListener('click', () => {
            if (sidebar.classList.contains('open')) {
                closeSidebar();
            } else {
                openSidebar();
            }
        });

        // Overlay click to close
        sidebarOverlay.addEventListener('click', closeSidebar);

        // ===== Swipe to close sidebar =====
        let touchStartX = 0;
        let touchCurrentX = 0;
        let isSwiping = false;

        sidebar.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            isSwiping = true;
        }, { passive: true });

        sidebar.addEventListener('touchmove', (e) => {
            if (!isSwiping) return;
            touchCurrentX = e.touches[0].clientX;
            const diff = touchStartX - touchCurrentX;
            // Only allow swipe left (to close)
            if (diff > 0) {
                const translateX = Math.min(diff, sidebar.offsetWidth);
                sidebar.style.transition = 'none';
                sidebar.style.transform = `translateX(-${translateX}px)`;
            }
        }, { passive: true });

        sidebar.addEventListener('touchend', () => {
            if (!isSwiping) return;
            isSwiping = false;
            const diff = touchStartX - touchCurrentX;
            sidebar.style.transition = '';
            sidebar.style.transform = '';
            // If swiped more than 80px left, close sidebar
            if (diff > 80) {
                closeSidebar();
            }
        }, { passive: true });

        // ===== Handle back button on mobile (browser history) =====
        window.addEventListener('popstate', () => {
            if (sidebar.classList.contains('open')) {
                closeSidebar();
            }
        });

        // ===== Initialize =====
        loadFileIndex();
    </script>
</body>
</html>
