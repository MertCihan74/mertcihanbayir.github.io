<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meditate - Mert Cihan Bayır</title>
    <link rel="icon" type="image/png" href="../mcb.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@200;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --text-color: #ffffff;
            --accent-color: #a5b4fc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #000;
            color: var(--text-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Video Background */
        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        #meditation-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 1s ease;
        }

        /* Overlay UI */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.2);
            z-index: 1;
            pointer-events: none; /* Allow clicks to pass through to video controls if needed, but we'll have custom controls or let browser handle it via z-index if we use standard */
        }

        /* Interface Elements */
        .ui-container {
            position: absolute;
            z-index: 10;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
            animation: fadeInDown 1s ease-out;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem 1.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            color: white;
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .logo-area {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.8;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .center-content {
            text-align: center;
            pointer-events: auto;
            transition: opacity 0.5s ease;
        }

        .greeting {
            font-size: 3rem;
            font-weight: 200;
            margin-bottom: 1rem;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            animation: breathe 6s infinite ease-in-out;
        }

        .controls {
            display: inline-flex;
            gap: 1.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 1rem 2rem;
            border-radius: 20px;
            box-shadow: var(--glass-shadow);
            margin-top: 1rem;
        }

        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
            color: var(--accent-color);
        }

        .bottom-bar {
            text-align: center;
            padding-bottom: 1rem;
            font-weight: 200;
            font-size: 0.9rem;
            opacity: 0.6;
            animation: fadeInUp 1s ease-out;
            pointer-events: auto;
        }

        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        
        .fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .greeting { font-size: 2rem; }
            .ui-container { padding: 1rem; }
            .back-btn span { display: none; }
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- The video source path is as requested -->
        <video id="meditation-video" loop playsinline>
            <source src="../video/meditation_lo-fi.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <div class="ui-container">
        <div class="top-bar">
            <a href="../index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                <span data-en="Back to Home" data-tr="Ana Sayfaya Dön">Back</span>
            </a>
            <div class="logo-area">Meditate</div>
        </div>

        <div class="center-content">
            <h1 class="greeting" id="greeting-text">Just Breathe</h1>
            <div class="controls">
                <button class="control-btn" id="play-pause-btn" title="Play/Pause">
                    <i class="fas fa-play"></i>
                </button>
                <button class="control-btn" id="mute-btn" title="Mute/Unmute">
                    <i class="fas fa-volume-up"></i>
                </button>
                <button class="control-btn" id="fullscreen-btn" title="Fullscreen">
                    <i class="fas fa-expand"></i>
                </button>
            </div>
        </div>

        <div class="bottom-bar">
            <p>Mert Cihan Bayır</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('meditation-video');
            const playPauseBtn = document.getElementById('play-pause-btn');
            const muteBtn = document.getElementById('mute-btn');
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            const iconPlay = playPauseBtn.querySelector('i');
            const iconMute = muteBtn.querySelector('i');
            const centerContent = document.querySelector('.center-content');
            
            let userInteracted = false;

            // Language support (simple version based on localStorage or default)
            // You can integrate with the main site's logic if moved to a global script
            
            // Toggle Play/Pause
            playPauseBtn.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                    iconPlay.className = 'fas fa-pause';
                    // Auto fade out controls for immersion after playing
                    setTimeout(() => {
                        if (!video.paused) {
                            centerContent.classList.add('fade-out');
                        }
                    }, 3000);
                } else {
                    video.pause();
                    iconPlay.className = 'fas fa-play';
                    centerContent.classList.remove('fade-out');
                }
            });

            // Bring controls back on mouse move
            document.addEventListener('mousemove', () => {
                centerContent.classList.remove('fade-out');
                // Debounced fade out could go here
            });
            document.addEventListener('click', () => {
                centerContent.classList.remove('fade-out');
            });

            // Toggle Mute
            muteBtn.addEventListener('click', () => {
                video.muted = !video.muted;
                if (video.muted) {
                    iconMute.className = 'fas fa-volume-mute';
                } else {
                    iconMute.className = 'fas fa-volume-up';
                }
            });

            // Toggle Fullscreen
            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.log(`Error attempting to enable fullscreen: ${err.message}`);
                    });
                    fullscreenBtn.querySelector('i').className = 'fas fa-compress';
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                        fullscreenBtn.querySelector('i').className = 'fas fa-expand';
                    }
                }
            });

            // Handle video end (loop is on, but just in case)
            video.addEventListener('ended', () => {
                iconPlay.className = 'fas fa-play';
                centerContent.classList.remove('fade-out');
            });
        });
    </script>
</body>
</html>
